version: "3.9"

services:
  agentcap:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - agentcap_data:/app/data
    environment:
      - DB_PATH=/app/data/agentcap.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  agentcap_data:
