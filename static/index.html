<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentCap — AI Agent Spend Governance</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--surface:#1a1b23;--surface2:#242530;--border:#2e2f3e;--text:#e4e4e7;--text2:#9ca3af;--accent:#6366f1;--accent2:#818cf8;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--radius:10px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent2);text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
header h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header .ver{color:var(--text2);font-size:.85rem}
/* Cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.stat-card .label{font-size:.8rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-card .value{font-size:1.8rem;font-weight:700}
.stat-card .value.green{color:var(--green)}.stat-card .value.red{color:var(--red)}.stat-card .value.orange{color:var(--orange)}.stat-card .value.accent{color:var(--accent2)}
/* Panels */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.panel h2{font-size:1.1rem;margin-bottom:16px;color:var(--accent2)}
/* Agent list */
.agent-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.agent-row:last-child{border-bottom:none}
.agent-name{font-weight:600;min-width:140px}
.agent-provider{color:var(--text2);font-size:.82rem;min-width:80px}
.bar-wrap{flex:1;height:20px;background:var(--surface2);border-radius:10px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:10px;transition:width .4s ease}
.bar-fill.ok{background:linear-gradient(90deg,#22c55e,#16a34a)}
.bar-fill.warn{background:linear-gradient(90deg,#f59e0b,#d97706)}
.bar-fill.danger{background:linear-gradient(90deg,#ef4444,#dc2626)}
.bar-text{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.72rem;color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.agent-budget{font-size:.82rem;color:var(--text2);min-width:100px;text-align:right}
.agent-actions{display:flex;gap:6px}
.agent-actions button{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.75rem}
.agent-actions button:hover{border-color:var(--accent);color:var(--accent2)}
/* Forms */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.82rem;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.btn{padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-sm{padding:5px 12px;font-size:.8rem}
/* Alerts */
.alert-item{padding:10px 14px;margin-bottom:8px;border-radius:8px;font-size:.88rem;display:flex;justify-content:space-between;align-items:center}
.alert-item.warning{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:var(--orange)}
.alert-item.critical{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.alert-item .ts{font-size:.75rem;opacity:.7}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;color:#fff;font-size:.9rem;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
.toast.show{opacity:1}.toast.ok{background:var(--green)}.toast.err{background:var(--red)}
/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface);border-radius:var(--radius);padding:4px;border:1px solid var(--border)}
.tab{padding:8px 20px;border-radius:8px;cursor:pointer;font-size:.88rem;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){color:var(--text)}
.tab-content{display:none}.tab-content.active{display:block}
/* Empty */
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.95rem}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AgentCap</h1>
    <span class="ver">AI Agent Spend Governance v2.0</span>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="dashboard">Dashboard</div>
    <div class="tab" data-tab="agents">Agents</div>
    <div class="tab" data-tab="usage">Record Usage</div>
    <div class="tab" data-tab="alerts">Alerts</div>
  </div>

  <!-- Dashboard -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="stats" id="stats"></div>
    <div class="panel">
      <h2>Top Agents by Spend</h2>
      <div id="agent-list-dash"></div>
    </div>
  </div>

  <!-- Agents -->
  <div id="tab-agents" class="tab-content">
    <div class="grid2">
      <div class="panel">
        <h2>Register Agent</h2>
        <form id="agent-form">
          <div class="form-group"><label>Name</label><input name="name" required placeholder="my-gpt4-agent"></div>
          <div class="form-group"><label>Model Provider</label>
            <select name="model_provider">
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic</option>
              <option value="google">Google</option>
              <option value="openrouter">OpenRouter</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group"><label>Model</label><input name="model" placeholder="gpt-4o" required></div>
          <div class="form-group"><label>Budget Limit ($)</label><input name="budget_limit" type="number" step="0.01" value="50" required></div>
          <div class="form-group"><label>Alert Threshold (%)</label><input name="alert_threshold_pct" type="number" min="1" max="100" value="80"></div>
          <div class="form-group"><label>Tags (comma-separated)</label><input name="tags" placeholder="production,chat"></div>
          <button type="submit" class="btn btn-primary">Add Agent</button>
        </form>
      </div>
      <div class="panel">
        <h2>All Agents</h2>
        <div id="agent-list-full"></div>
      </div>
    </div>
  </div>

  <!-- Usage -->
  <div id="tab-usage" class="tab-content">
    <div class="grid2">
      <div class="panel">
        <h2>Record Usage</h2>
        <form id="usage-form">
          <div class="form-group"><label>Agent</label><select name="agent_id" id="usage-agent-select" required></select></div>
          <div class="form-group"><label>Tokens Used</label><input name="tokens" type="number" value="1000" required></div>
          <div class="form-group"><label>Cost ($)</label><input name="cost" type="number" step="0.0001" value="0.03" required></div>
          <div class="form-group"><label>Model</label><input name="model" placeholder="gpt-4o"></div>
          <button type="submit" class="btn btn-primary">Record</button>
        </form>
      </div>
      <div class="panel">
        <h2>Daily Spend</h2>
        <div class="form-group"><label>Agent</label><select id="daily-agent-select"></select></div>
        <div id="daily-chart" style="margin-top:12px"></div>
      </div>
    </div>
  </div>

  <!-- Alerts -->
  <div id="tab-alerts" class="tab-content">
    <div class="panel">
      <h2>Budget Alerts</h2>
      <div id="alerts-list"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = '';

// Tabs
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-' + t.dataset.tab).classList.add('active');
    if (t.dataset.tab === 'dashboard') loadDashboard();
    if (t.dataset.tab === 'agents') loadAgents();
    if (t.dataset.tab === 'alerts') loadAlerts();
  });
});

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(() => el.className = 'toast', 2500);
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || res.statusText);
  }
  return res.json();
}

// Dashboard
async function loadDashboard() {
  try {
    const d = await api('/dashboard');
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="label">Total Agents</div><div class="value accent">${d.total_agents}</div></div>
      <div class="stat-card"><div class="label">Total Spend</div><div class="value green">$${d.total_spend.toFixed(2)}</div></div>
      <div class="stat-card"><div class="label">Total Budget</div><div class="value">$${d.total_budget.toFixed(2)}</div></div>
      <div class="stat-card"><div class="label">Active Alerts</div><div class="value ${d.active_alerts > 0 ? 'red' : 'green'}">${d.active_alerts}</div></div>
    `;
    const agents = d.top_spenders || [];
    if (!agents.length) {
      document.getElementById('agent-list-dash').innerHTML = '<div class="empty">No agents yet. Add one from the Agents tab.</div>';
      return;
    }
    document.getElementById('agent-list-dash').innerHTML = agents.map(a => agentRow(a)).join('');
  } catch (e) {
    document.getElementById('stats').innerHTML = `<div class="empty">Failed to load dashboard: ${e.message}</div>`;
  }
}

function agentRow(a) {
  const pct = a.budget_limit > 0 ? Math.min((a.total_spend / a.budget_limit) * 100, 100) : 0;
  const cls = pct >= 90 ? 'danger' : pct >= 70 ? 'warn' : 'ok';
  return `<div class="agent-row">
    <span class="agent-name">${esc(a.name)}</span>
    <span class="agent-provider">${esc(a.model_provider || '')}</span>
    <div class="bar-wrap">
      <div class="bar-fill ${cls}" style="width:${pct}%"></div>
      <span class="bar-text">${pct.toFixed(1)}%</span>
    </div>
    <span class="agent-budget">$${a.total_spend.toFixed(2)} / $${a.budget_limit.toFixed(2)}</span>
    <div class="agent-actions">
      <button onclick="resetBudget(${a.id})">Reset</button>
    </div>
  </div>`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Agents
async function loadAgents() {
  try {
    const agents = await api('/agents');
    if (!agents.length) {
      document.getElementById('agent-list-full').innerHTML = '<div class="empty">No agents registered.</div>';
      return;
    }
    document.getElementById('agent-list-full').innerHTML = agents.map(a => agentRow(a)).join('');
    populateAgentSelects(agents);
  } catch (e) {
    document.getElementById('agent-list-full').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

function populateAgentSelects(agents) {
  const opts = agents.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
  document.getElementById('usage-agent-select').innerHTML = opts;
  document.getElementById('daily-agent-select').innerHTML = opts;
}

// Add agent
document.getElementById('agent-form').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = {
    name: fd.get('name'),
    model_provider: fd.get('model_provider'),
    model: fd.get('model'),
    budget_limit: parseFloat(fd.get('budget_limit')),
    alert_threshold_pct: parseInt(fd.get('alert_threshold_pct')),
    tags: fd.get('tags') ? fd.get('tags').split(',').map(s => s.trim()).filter(Boolean) : [],
  };
  try {
    await api('/agents', { method: 'POST', body: JSON.stringify(body) });
    toast('Agent created');
    e.target.reset();
    loadAgents();
  } catch (err) { toast(err.message, false); }
});

// Record usage
document.getElementById('usage-form').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const agentId = fd.get('agent_id');
  const body = {
    tokens: parseInt(fd.get('tokens')),
    cost: parseFloat(fd.get('cost')),
    model: fd.get('model') || undefined,
  };
  try {
    await api(`/agents/${agentId}/usage`, { method: 'POST', body: JSON.stringify(body) });
    toast('Usage recorded');
  } catch (err) { toast(err.message, false); }
});

// Daily spend chart (simple ASCII bars)
document.getElementById('daily-agent-select').addEventListener('change', loadDailySpend);
async function loadDailySpend() {
  const sel = document.getElementById('daily-agent-select');
  if (!sel.value) return;
  try {
    const data = await api(`/agents/${sel.value}/usage/daily`);
    if (!data.length) {
      document.getElementById('daily-chart').innerHTML = '<div class="empty">No usage data.</div>';
      return;
    }
    const max = Math.max(...data.map(d => d.total_cost));
    document.getElementById('daily-chart').innerHTML = data.map(d => {
      const pct = max > 0 ? (d.total_cost / max) * 100 : 0;
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:.82rem">
        <span style="min-width:80px;color:var(--text2)">${d.date}</span>
        <div style="flex:1;height:16px;background:var(--surface2);border-radius:8px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:var(--accent);border-radius:8px"></div>
        </div>
        <span style="min-width:60px;text-align:right">$${d.total_cost.toFixed(4)}</span>
      </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('daily-chart').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

// Reset budget
async function resetBudget(id) {
  if (!confirm('Reset spend to $0 for this agent?')) return;
  try {
    await api(`/agents/${id}/reset`, { method: 'POST' });
    toast('Budget reset');
    loadDashboard();
    loadAgents();
  } catch (e) { toast(e.message, false); }
}

// Alerts
async function loadAlerts() {
  try {
    const alerts = await api('/alerts');
    if (!alerts.length) {
      document.getElementById('alerts-list').innerHTML = '<div class="empty">No alerts. All agents within budget.</div>';
      return;
    }
    document.getElementById('alerts-list').innerHTML = alerts.map(a => {
      const cls = a.alert_type === 'budget_exceeded' ? 'critical' : 'warning';
      return `<div class="alert-item ${cls}">
        <span>${esc(a.agent_name || 'Agent #' + a.agent_id)} — ${esc(a.alert_type.replace(/_/g, ' '))}: ${a.message}</span>
        <span class="ts">${a.created_at || ''}</span>
      </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('alerts-list').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

// Init
loadDashboard();
fetch('/agents').then(r => r.json()).then(populateAgentSelects).catch(() => {});
</script>
</body>
</html>
