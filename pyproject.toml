[project]
name = "agentcap"
version = "2.0.0"
description = "AI agent spend governance — monitor and cap costs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "aiosqlite>=0.19",
    "pydantic>=2.0",
    "httpx>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
